    <rect x="240" y="320" width="340" height="190" fill="url(#cyl)"/>
    <path d="M 410 292 A 180 34 0 0 1 590 292 L 590 522 A 180 34 0 0 1 410 522 Z" fill="url(#cyl)" opacity="0.35"/>

    <g opacity="0.85">
      <rect x="268" y="380" width="110" height="11" rx="5" fill="#fbbf24"/>
